name: Unit Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    name: Test SDK (Native & Fallback)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Lua 5.1 and Headers
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev gcc

      - name: Test Pure-Lua Fallback (protoc.lua)
        run: |
          echo "=== Testing Pure-Lua Protobuf Fallback ==="
          lua5.1 test_sdk.lua

      - name: Build Native lua-protobuf (pb.so)
        run: |
          echo "=== Compiling native pb.so ==="
          gcc -O2 -shared -fPIC -I/usr/include/lua5.1 lib/src/pb.c -o lib/pb.so
          ls -la lib/pb.so

      - name: Test Native C Extension (pb.so)
        run: |
          echo "=== Testing with Native pb.so ==="
          lua5.1 test_sdk.lua
